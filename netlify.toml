# Site do Osirion
[build]
  publish = "app"
  # Cada publicação gasta créditos do Netlify: só publica quando a mensagem do commit tiver [publicar].
  # Os outros commits ficam guardados no GitHub e entram na próxima publicação.
  ignore = "git log -1 --pretty=%B | grep -qF '[publicar]' && exit 1 || exit 0"
# A chave web do Firebase (em app/firebase-config.js) é pública por natureza: vai para todo celular que abre o app,
# e quem protege os dados são as regras do Firestore. O detector de segredos da Netlify a confunde com uma senha
# e trava a publicação; aqui ela fica liberada (só ela: o detector continua ligado para todo o resto).
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyCgOJwg5Z2Perz9ahPWxeLMfynzqXxa0vk"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
