<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Osirion</title>
<meta name="description" content="Osirion: sonho lúcido e viagem astral, com o método Arhat, de Vivian Pupin.">
<meta name="theme-color" content="#121427">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Osirion">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:ital,wght@0,300;0,400;0,600;1,400&display=swap">
<style>
/* Layout: um celular centrado na noite; telas trocadas pela barra de baixo, práticas abrem por cima. Visual único, noturno. */
:root {
  --ceu: #121427;        /* fundo, o céu das ilustrações escurecido */
  --ceu-2: #1b1e38;      /* superfícies */
  --ceu-3: #272b4d;      /* bordas e trilhos */
  --areia: #eee5d4;      /* texto */
  --areia-2: #b9b2c9;    /* texto secundário */
  --ocre: #d9662f;       /* o laranja das montanhas */
  --cristal: #f5c75b;    /* o dourado */
  --nevoeiro: #a9b2f0;   /* muda com a escolha da pessoa */
  --display: "Marcellus", "Cormorant Garamond", Georgia, serif;
  --corpo: "Karla", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #1d2042 0%, var(--ceu) 60%) fixed, var(--ceu);
  color: var(--areia);
  font: 400 16px/1.5 var(--corpo);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}
.aviso-prot { max-width: 420px; width: 100%; font-size: 13px; color: var(--areia-2); text-align: center; text-wrap: balance; }
.aviso-prot b { color: var(--cristal); font-weight: 600; }

.celular {
  position: relative; width: 100%; max-width: 400px; height: min(820px, calc(100dvh - 90px)); min-height: 600px;
  border-radius: 34px; overflow: hidden; background: var(--ceu);
  border: 1px solid var(--ceu-3);
  box-shadow: 0 30px 80px -20px rgba(0,0,0,.7), 0 0 0 6px #0b0c18;
  display: flex; flex-direction: column;
}
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* No celular, o app ocupa a tela inteira, sem a moldura. */
@media (max-width: 460px) {
  body { padding: 0; gap: 0; }
  .aviso-prot { display: none; }
  .celular { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; max-width: none; border-radius: 0; border: 0; box-shadow: none; }
}
.nevoa {
  position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(60% 40% at 80% 8%, color-mix(in srgb, var(--nevoeiro) 22%, transparent), transparent 70%),
    radial-gradient(70% 50% at 10% 100%, color-mix(in srgb, var(--nevoeiro) 12%, transparent), transparent 70%);
  transition: background .8s;
}
.telas { position: relative; z-index: 1; flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.tela { padding: 22px 20px 28px; display: flex; flex-direction: column; gap: 18px; }

h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 30px; line-height: 1.15; }
h2 { font-size: 22px; line-height: 1.2; }
h3 { font-size: 18px; }
p { margin: 0; }
.rotulo { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--nevoeiro); font-weight: 600; }
.suave { color: var(--areia-2); font-size: 14px; }
.topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.marca { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 20px; letter-spacing: .3em; }
.marca img { width: 34px; height: auto; }
.marca-nome { display: flex; flex-direction: column; line-height: 1.1; }
.marca-nome small { font-family: var(--corpo); font-size: 10px; letter-spacing: .08em; color: var(--areia-2); margin-top: 3px; }
.chip-nev { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--areia-2); background: var(--ceu-2); border: 1px solid var(--ceu-3); border-radius: 999px; padding: 5px 10px 5px 6px; cursor: pointer; font-family: inherit; }
.bolinha { width: 16px; height: 16px; border-radius: 50%; background: var(--nevoeiro); box-shadow: 0 0 10px var(--nevoeiro); }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--cristal); outline-offset: 2px; }
.btn { border: 0; border-radius: 14px; padding: 13px 18px; background: var(--cristal); color: #231a07; font-weight: 600; font-size: 15px; }
.btn.fantasma { background: transparent; color: var(--areia); border: 1px solid var(--ceu-3); }
.btn.largo { width: 100%; }

/* Capa do ato */
.capa { position: relative; border-radius: 22px; overflow: hidden; min-height: 210px; display: flex; align-items: flex-end; }
.capa img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.capa::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,20,39,0) 30%, rgba(18,20,39,.92) 100%); }
.capa .txt { position: relative; z-index: 1; padding: 18px; display: flex; flex-direction: column; gap: 4px; }
.capa .txt .rotulo { color: var(--cristal); }

/* Momentos do dia */
.momento { display: flex; flex-direction: column; gap: 10px; }
.momento-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.hora { font-size: 12px; color: var(--areia-2); font-variant-numeric: tabular-nums; }
.pratica {
  display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px;
  background: var(--ceu-2); border: 1px solid var(--ceu-3); border-radius: 16px; padding: 12px 14px; text-align: left; width: 100%;
}
.pratica .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--nevoeiro) 14%, var(--ceu)); }
.pratica .ico svg { width: 22px; height: 22px; stroke: var(--nevoeiro); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.pratica .nome { font-weight: 600; font-size: 15px; }
.pratica .det { font-size: 13px; color: var(--areia-2); }
.pratica .feito { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--ceu-3); display: grid; place-items: center; font-size: 13px; color: transparent; }
.pratica.ok .feito { background: var(--cristal); border-color: var(--cristal); color: #231a07; }
.pratica.ok .nome { color: var(--areia-2); }

/* Notificação do teste de realidade */
.notif { background: color-mix(in srgb, var(--areia) 10%, var(--ceu-2)); border-radius: 18px; padding: 12px 14px; display: grid; grid-template-columns: 34px 1fr; gap: 10px; text-align: left; border: 0; width: 100%; }
.notif .sinal { width: 34px; height: 34px; border-radius: 9px; background: #0b0c18; display: grid; place-items: center; }
.notif .sinal svg { width: 24px; height: 24px; fill: none; stroke: var(--nevoeiro); stroke-width: 1.6; stroke-linecap: round; }
.notif .linha1 { display: flex; justify-content: space-between; font-size: 12px; color: var(--areia-2); }
.notif .msg { font-weight: 600; }

/* Barra de baixo */
.nav { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--ceu-3); background: color-mix(in srgb, var(--ceu) 88%, black); padding: 8px 6px 10px; }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--areia-2); padding: 4px 0; border-radius: 10px; }
.nav svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--areia); }
.nav button[aria-current="page"] svg { stroke: var(--nevoeiro); filter: drop-shadow(0 0 6px var(--nevoeiro)); }

/* Sobreposições (práticas) */
.sobre { position: absolute; inset: 0; z-index: 5; background: var(--ceu); display: flex; flex-direction: column; overflow-y: auto; }
.sobre .tela { flex: 1; }
.fechar { background: none; border: 0; color: var(--areia-2); font-size: 14px; padding: 4px 0; display: inline-flex; align-items: center; gap: 6px; }

/* Entrada (como nos apps da Caravana) */
.entrada { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; padding: 24px 20px; overflow-y: auto;
  background: linear-gradient(rgba(10,11,24,.72), rgba(10,11,24,.86)), url("img/noite.webp") center / cover; }
.entrada .cartao-ent { width: 100%; max-width: 340px; background: #ece5d6; color: #1d2042; border-radius: 22px; padding: 30px 24px 28px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; box-shadow: 0 20px 60px -20px rgba(0,0,0,.8); }
.entrada .cartao-ent img { width: 92px; height: auto; }
.entrada .selo { font-size: 11px; letter-spacing: .28em; color: #8a6a3c; }
.entrada h1 { font-size: 26px; color: #1d2042; line-height: 1.15; }
.entrada p { font-size: 14px; color: #4a4560; }
.entrada input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid #c9b48f; background: #fff; color: #1d2042; font: inherit; text-align: center; }
.entrada .btn-ent { border: 0; border-radius: 999px; padding: 12px 30px; background: #1d2042; color: #ece5d6; font-weight: 600; font-size: 15px; margin-top: 4px; }
.entrada .erro { color: #a3402a; font-size: 13px; min-height: 18px; }

/* A travessia: entrar na caverna */
.caverna { position: absolute; inset: 0; z-index: 7; display: flex; flex-direction: column; overflow-y: auto; transition: background 1.2s; }
.caverna .tela { flex: 1; justify-content: space-between; text-align: center; align-items: center; }
.caverna .passo-c { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; max-width: 34ch; }
.caverna h1 { font-size: 30px; }
.caverna p { font-size: 17px; line-height: 1.6; color: var(--areia); }
.caverna .nota-c { font-size: 13px; color: var(--areia-2); }
.caverna .ilus { max-height: 210px; }
.caverna .luz { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, color-mix(in srgb, var(--nevoeiro) 70%, transparent) 30%, transparent 70%); animation: respira 5s ease-in-out infinite; }
@keyframes respira { 50% { transform: scale(1.18); opacity: .8; } }
.caverna .segurar { width: 130px; height: 130px; border-radius: 50%; border: 1.5px solid var(--areia-2); background: radial-gradient(circle, color-mix(in srgb, var(--cristal) 35%, transparent), transparent 70%); color: var(--areia); font-size: 14px; transition: transform 4s ease-in-out; user-select: none; -webkit-user-select: none; touch-action: none; }
.caverna .segurar.inspira { transform: scale(1.35); }
.caverna .marcas { display: flex; gap: 8px; justify-content: center; }
.caverna .marcas i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--areia-2); }
.caverna .marcas i.on { background: var(--cristal); border-color: var(--cristal); }
.caverna .profundidade { display: flex; gap: 5px; justify-content: center; }
.caverna .profundidade i { width: 18px; height: 3px; border-radius: 3px; background: rgba(238,229,212,.18); }
.caverna .profundidade i.on { background: var(--areia-2); }
.caverna .rotulo { color: var(--cristal); }
.campo-trav { width: 100%; max-width: 300px; padding: 14px; border-radius: 14px; border: 1px solid var(--ceu-3); background: var(--ceu-2); color: var(--areia); font: inherit; font-size: 17px; text-align: center; }
.opcoes-trav { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 320px; }
.op-trav { padding: 13px 16px; border-radius: 14px; border: 1px solid var(--ceu-3); background: color-mix(in srgb, var(--ceu-2) 80%, transparent); text-align: left; font-size: 15px; }
.op-trav[aria-pressed="true"] { border-color: var(--cristal); background: color-mix(in srgb, var(--cristal) 16%, var(--ceu-2)); }
.sono { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.sono label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--areia-2); }
.sono input { padding: 12px; border-radius: 12px; border: 1px solid var(--ceu-3); background: var(--ceu-2); color: var(--areia); font: inherit; font-size: 22px; font-variant-numeric: tabular-nums; }
.caminho { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 1px solid var(--ceu-3); display: flex; flex-direction: column; gap: 14px; text-align: left; max-width: 320px; }
.caminho li { position: relative; display: flex; flex-direction: column; gap: 2px; }
.caminho li::before { content: ""; position: absolute; left: -24px; top: 4px; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--nevoeiro); background: var(--ceu); }
.caminho li:nth-child(4)::before { background: var(--cristal); border-color: var(--cristal); box-shadow: 0 0 10px var(--cristal); }
.caminho b { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--nevoeiro); }
.caminho span { font-size: 15px; }
.pe-trav { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
@media (prefers-reduced-motion: reduce) { .caverna .luz { animation: none; } .caverna .segurar { transition: none; } }

/* Abertura: o nevoeiro */
.abertura { padding: 0; }
.abertura .arte { position: relative; height: 46%; min-height: 250px; }
.abertura .arte img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.abertura .arte::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,20,39,0) 40%, var(--ceu) 100%); }
.abertura .corpo { padding: 0 22px 26px; margin-top: -40px; position: relative; display: flex; flex-direction: column; gap: 14px; }
.cores { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.cor { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 2px solid transparent; position: relative; }
.cor[aria-pressed="true"] { border-color: var(--areia); box-shadow: 0 0 16px currentColor; }
.cor-propria { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--areia-2); }
.cor-propria input { width: 44px; height: 30px; border: 1px solid var(--ceu-3); border-radius: 8px; background: none; padding: 0; }

/* Respiração */
.resp { align-items: center; text-align: center; justify-content: center; }
.resp .fechar { align-self: flex-start; }
.circulo-wrap { width: 240px; height: 240px; max-width: 100%; display: grid; place-items: center; position: relative; }
.circulo { width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, var(--cristal) 0%, color-mix(in srgb, var(--cristal) 30%, transparent) 55%, transparent 72%); transition: transform 4s ease-in-out; }
.circulo.grande { transform: scale(2.4); }
.contagem { font-family: var(--display); font-size: 40px; font-variant-numeric: tabular-nums; }
.fase { min-height: 48px; max-width: 30ch; color: var(--areia-2); }

/* Teste */
.passos { display: flex; flex-direction: column; gap: 10px; counter-reset: p; }
.passo { background: var(--ceu-2); border: 1px solid var(--ceu-3); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.passo h3 { font-size: 16px; font-family: var(--corpo); font-weight: 600; }
.letras { font-family: var(--display); font-size: 26px; letter-spacing: .2em; text-align: center; padding: 10px 0; color: var(--cristal); }
.contador { display: flex; gap: 6px; flex-wrap: wrap; }
.contador i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ceu-3); }
.contador i.on { background: var(--nevoeiro); border-color: var(--nevoeiro); }

/* Noite */
.afirm { font-family: var(--display); font-size: 24px; line-height: 1.35; text-align: center; text-wrap: balance; padding: 18px 6px; color: var(--areia); }
.afirm small { display: block; font-family: var(--corpo); font-size: 12px; color: var(--areia-2); margin-top: 10px; letter-spacing: .1em; text-transform: uppercase; }
.player { background: var(--ceu-2); border: 1px solid var(--ceu-3); border-radius: 18px; padding: 14px; display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; }
.player .play { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--nevoeiro); color: var(--ceu); font-size: 18px; }
.trilho { height: 4px; background: var(--ceu-3); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.trilho span { display: block; height: 100%; width: 0; background: var(--nevoeiro); transition: width .5s linear; }
ol.roteiro { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: var(--areia); }
ol.roteiro li::marker { color: var(--nevoeiro); font-family: var(--display); }
.texto { display: flex; flex-direction: column; gap: 14px; line-height: 1.65; }
.texto p { max-width: 65ch; }
.texto .afirm { white-space: pre-line; padding: 14px 6px; }
.texto .afirm.longa { font-size: 18px; line-height: 1.55; }
.texto .sub { font-family: var(--display); font-size: 19px; color: var(--cristal); }
.texto .pergunta { font-family: var(--display); font-size: 21px; text-align: center; color: var(--nevoeiro); padding: 6px 0; }
.texto ul.lista { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.texto ul.lista li::marker { color: var(--nevoeiro); }
.cita { margin: 0; padding: 4px 0 4px 16px; border-left: 2px solid var(--cristal); font-family: var(--display); font-size: 19px; line-height: 1.45; color: var(--areia); }
.cita cite { display: block; font-family: var(--corpo); font-style: normal; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--areia-2); margin-top: 8px; }
.intro-ato { font-size: 14px; color: var(--areia-2); }
.ler { display: flex; flex-direction: column; gap: 8px; }
.cap { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--ceu-2); border: 1px solid var(--ceu-3); border-radius: 14px; padding: 12px 14px; }
.cap .t { font-family: var(--display); font-size: 17px; }
.cap .seta { color: var(--nevoeiro); flex: none; white-space: nowrap; }
.livro-capa { position: relative; border-radius: 22px; overflow: hidden; min-height: 180px; display: flex; align-items: flex-end; }
.livro-capa img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.livro-capa::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,20,39,.1), rgba(18,20,39,.9)); }
.livro-capa .txt { position: relative; z-index: 1; padding: 18px; display: flex; flex-direction: column; gap: 4px; }
.nav button { font-size: 10.5px; }

/* Diário */
.diario { background: #0b0c18; }
.gravar { width: 150px; height: 150px; border-radius: 50%; border: 0; align-self: center; background: radial-gradient(circle, color-mix(in srgb, var(--nevoeiro) 50%, #0b0c18) 0%, #0b0c18 70%); box-shadow: 0 0 0 1px var(--ceu-3), 0 0 40px -6px var(--nevoeiro); color: var(--areia); font-family: var(--display); font-size: 17px; display: grid; place-items: center; }
.gravar.ativo { animation: pulsar 1.6s ease-in-out infinite; }
@keyframes pulsar { 50% { box-shadow: 0 0 0 1px var(--nevoeiro), 0 0 70px 0 var(--nevoeiro); } }
.perguntas { display: flex; flex-direction: column; gap: 4px; text-align: center; font-family: var(--display); font-size: 19px; color: var(--areia-2); }
textarea { width: 100%; min-height: 110px; resize: vertical; background: var(--ceu-2); border: 1px solid var(--ceu-3); border-radius: 14px; color: var(--areia); font: inherit; padding: 12px; }
.tipos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tipo { background: var(--ceu-2); border: 1px solid var(--ceu-3); border-radius: 14px; padding: 10px; display: flex; align-items: center; gap: 10px; font-size: 13px; text-align: left; }
.tipo[aria-pressed="true"] { border-color: var(--nevoeiro); background: color-mix(in srgb, var(--nevoeiro) 14%, var(--ceu-2)); }
.tipo canvas { flex: none; }
.entrada { border-top: 1px solid var(--ceu-3); padding-top: 12px; display: flex; flex-direction: column; gap: 4px; }
.entrada .data { font-size: 12px; color: var(--areia-2); display: flex; justify-content: space-between; }
.entrada p { font-size: 14px; }

/* Calendário do diário */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--ceu-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; padding: 8px; border-radius: 9px; font-size: 14px; color: var(--areia-2); }
.seg button[aria-pressed="true"] { background: var(--ceu-3); color: var(--areia); }
.mes-cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

  background: radial-gradient(1px 1px at 20% 30%, #fff8 50%, transparent), radial-gradient(1px 1px at 70% 20%, #fff6 50%, transparent), radial-gradient(1px 1px at 85% 70%, #fff5 50%, transparent), radial-gradient(120% 120% at 0% 0%, #2a2f63, #0e1024); }

.altar { position: relative; width: min(330px, 100%); aspect-ratio: 1; margin: 4px auto 0; }

/* Socorro e alvos */

.tira { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--ceu-3); background: none; color: var(--areia-2); }
.cena-p { min-height: 70px; }
.toast-selo { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); z-index: 9; display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-radius: 999px; background: #241f12; border: 1px solid var(--cristal); box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 20px rgba(245,199,91,.3); animation: toast 4.5s ease forwards; white-space: nowrap; }

.cerimonia { position: absolute; inset: 0; overflow-y: auto; background: radial-gradient(90% 60% at 50% 30%, #2a2552, #07080f 70%); }

.vez { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--ceu-3); background: none; color: var(--areia-2); }
.vez i { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--ceu-3); display: grid; place-items: center; font-style: normal; }
.vez[aria-pressed="true"] { border-color: var(--nevoeiro); color: var(--areia); background: color-mix(in srgb, var(--nevoeiro) 12%, transparent); }

.vez[aria-pressed="true"] i::after { content: "✓"; font-size: 10px; color: var(--ceu); font-weight: 700; }
/* ---------- Diário: manhã, alvo, sono, pontes ---------- */
.diario.manha { background: #050509; }
.diario.manha .perguntas, .diario.manha .suave { opacity: .8; }
.cheguei { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 16px; border: 1px solid color-mix(in srgb, var(--cristal) 35%, var(--ceu-3)); background: var(--ceu-2); }

/* ---------- Sorteio: lua cheia, reino seu, áudio ---------- */

/* ---------- Modo noite: vermelho escuro, para não acordar os olhos ---------- */

<body>

<p class="aviso-prot"><b>Versão de teste do Osirion.</b> O que você anotar fica só neste aparelho.</p>

<div class="celular" id="app">
  <div class="nevoa" aria-hidden="true"></div>
  <div class="telas" id="telas"></div>
  <nav class="nav" id="nav" aria-label="Seções">
    <button data-aba="hoje"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 1 0 9 9 9 9 0 1 1-9-9z"/></svg>Hoje</button>
    <button data-aba="diario"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Diário</button>
    <button data-aba="ceu"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/><circle cx="5" cy="18" r="1"/><circle cx="18" cy="17" r="1.4"/></svg>Duat</button>
    <button data-aba="capsulas"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="5"/><path d="M7 12h10"/></svg>Cápsulas</button>
    <button data-aba="atos"><svg viewBox="0 0 24 24"><path d="M12 2l6 8-2 10H8L6 10z"/><path d="M6 10h12M12 2v18"/></svg>Jornada</button>
  </nav>
</div>

<script src="conteudo.js"></script>
<script src="capsulas.js"></script>
<script src="alvos.js"></script>
<script>
(function () {
  const IMG = { noite: "img/noite.webp", fios: "img/fios.webp", marca: "img/olho-marca.png" };
  // Desenhos do livro Arhat, recortados com fundo transparente.
  const ILUS = nome => `img/livro/${nome}.webp`;
  const TEXTURA = { livro: ILUS("textura-dourada"), ciencia: ILUS("textura-azul"), tradicoes: ILUS("textura-nuvem"), viajantes: ILUS("textura-azul") };
  // Sinal do Osirion nos avisos: o ícone do app, o olho do livro Arhat.
  const SINAL = '<img class="sinal" src="apple-touch-icon.png" alt="">';

  const ICO = {
    sol: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    mao: '<svg viewBox="0 0 24 24"><path d="M8 13V5a1.5 1.5 0 0 1 3 0v6M11 11V4a1.5 1.5 0 0 1 3 0v7M14 11V5.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7 6 6 0 0 1-5-3l-2-4a1.5 1.5 0 0 1 2.6-1.5L8 15"/></svg>',
    lua: '<svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 1 0 9 9 9 9 0 1 1-9-9z"/></svg>',
    vela: '<svg viewBox="0 0 24 24"><path d="M12 3c2 2.5 2 4.5 0 6-2-1.5-2-3.5 0-6z"/><rect x="9" y="11" width="6" height="10" rx="1"/></svg>',
    pena: '<svg viewBox="0 0 24 24"><path d="M5 19c7 0 13-6 14-15C10 5 5 11 5 19z"/><path d="M5 19l8-8"/></svg>',
    agua: '<svg viewBox="0 0 24 24"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg>',
    espiral: '<svg viewBox="0 0 24 24"><path d="M12 12a2 2 0 1 1 2-2 4 4 0 1 1-4-4 6 6 0 1 1-6 6"/></svg>',
    luz: '<svg viewBox="0 0 24 24"><path d="M12 2v20M8 4l4 4 4-4M7 22h10"/></svg>',
    raiz: '<svg viewBox="0 0 24 24"><path d="M12 3v8M12 11c-3 2-5 5-6 10M12 11c3 2 5 5 6 10M12 11v10"/></svg>'
  };

  // O conteúdo vem do livro (conteudo.js).
  const ATOS = window.ARHAT.ATOS.map(a => Object.assign({}, a, { capa: IMG[a.capa] }));
  const CAPS = window.CAPSULAS;
  const TEMAS = { livro: "Do livro Arhat", ciencia: "Ciência do sono", tradicoes: "Tradições do sonho", viajantes: "Técnicas dos viajantes" };

  const CORES = [
    { nome: "Lilás", v: "#a9b2f0" }, { nome: "Azul", v: "#6fa8ff" }, { nome: "Dourado", v: "#f5c75b" },
    { nome: "Verde-água", v: "#7fd6c2" }, { nome: "Rosa", v: "#f0a3c4" }, { nome: "Branco", v: "#f2efe8" }
  ];
  const TIPOS = [
    { k: 0, nome: "Noite negra, sem lembranças" }, { k: 1, nome: "Noite com sonhos" },
    { k: 2, nome: "Algum grau de lucidez" }, { k: 3, nome: "Sonho lúcido ou viagem astral" }
  ];
  const REINOS = window.REINOS;
  // Além dos nove reinos: a Lua Cheia (só perto da lua cheia, entra no sorteio) e os lugares que a pessoa guardou
  // (esses ela escolhe direto; o sorteio fica só com o oráculo, para ser sincronicidade).
  const LUA = 9, SEUS = 10;
  function reino(r) {
    if (r < REINOS.length) return REINOS[r];
    if (r === LUA) return window.REINO_LUA;
    if (r === SEUS) return { id: "seus", ilus: "olho", nome: "Os seus lugares", alvos: (est.pessoais || []).map(p => [p.nome, p.cena || "O lugar como você o guarda na memória, com todos os detalhes."]) };
    return null;
  }
  function reinosAtivos() { const l = REINOS.map((_, i) => i); if (luaCheia()) l.push(LUA); return l; }
  const sorteia = lista => Math.floor(Math.random() * lista.length);
  // Uma leitura é uma combinação: reino, alvo, chegada, sentido, duas tarefas e a pergunta do diário.
  function novaLeitura(r) {
    const t1 = sorteia(window.TAREFAS); let t2 = sorteia(window.TAREFAS); if (t2 === t1) t2 = (t2 + 1) % window.TAREFAS.length;
    return { r, a: sorteia(reino(r).alvos), c: sorteia(window.CHEGADAS), s: sorteia(window.SENTIDOS), t: [t1, t2], q: sorteia(window.PERGUNTAS) };
  }
  function alvoDe(l) {
    const R = l && typeof l === "object" ? reino(l.r) : null;
    if (!R || !R.alvos[l.a]) return null;
    const [nome, cena] = R.alvos[l.a];
    return { reino: R.nome, ilus: R.ilus, nome, cena, chegada: window.CHEGADAS[l.c], sentido: window.SENTIDOS[l.s], tarefas: l.t.map(k => window.TAREFAS[k]), pergunta: window.PERGUNTAS[l.q] };
  }
  const alvoTexto = l => { const a = alvoDe(l); return a ? `${a.nome}. ${a.chegada} Esta noite eu vou até lá e sei que estou sonhando.` : ""; };

  // Estado guardado só neste aparelho.
  const guardado = (() => { try { return JSON.parse(localStorage.getItem("arhat") || "{}"); } catch (e) { return {}; } })();
  const est = Object.assign({ entrou: null, travessia: null, nevoeiro: null, ato: 1, feitos: {}, testes: 2, diario: [], alvo: null, inicio: null, vistas: {}, adianta: 0, hist: {}, selos: {}, album: {}, pessoais: [], semanas: {}, dejavus: [], nivelVisto: 0 }, guardado);
  if (!est.inicio) { const d = new Date(); est.inicio = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
  // Dia da jornada: conta desde o primeiro dia no app (no protótipo dá para adiantar).
  function diaDaJornada() {
    const [a, m, d] = est.inicio.split("-").map(Number);
    const passados = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(a, m - 1, d).getTime()) / 864e5);
    return Math.min(CAPS.length, Math.max(1, passados + 1 + (est.adianta || 0)));
  }
  function salvar() { try { localStorage.setItem("arhat", JSON.stringify(est)); } catch (e) {} }

  let aba = "hoje";
  const telas = document.getElementById("telas");
  const app = document.getElementById("app");

  function aplicarCor() { app.style.setProperty("--nevoeiro", est.nevoeiro || "#a9b2f0"); }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const nomeCor = () => (CORES.find(c => c.v === est.nevoeiro) || { nome: "seu" }).nome;

  function topo() {
    return `<div class="topo"><div class="marca"><img src="${IMG.marca}" alt=""><span class="marca-nome">OSIRION<small>Sonho lúcido e viagem astral</small></span></div>
      <button class="chip-nev" data-acao="nevoeiro"><span class="bolinha"></span>${est.nevoeiro ? "nevoeiro " + esc(nomeCor()).toLowerCase() : "procurando o nevoeiro"}</button></div>`;
  }

  function blocos(lista) {
    return `<div class="texto">${lista.map(b => {
      if (b.p) return `<p class="${b.grande ? "grande-p" : ""}">${esc(b.p)}</p>`;
      if (b.afirm) return `<p class="afirm ${b.afirm.length > 120 ? "longa" : ""}">${esc(b.afirm)}${b.fonte ? `<small>${esc(b.fonte)}</small>` : ""}</p>`;
      if (b.passos) return `<ol class="roteiro">${b.passos.map(x => `<li>${esc(x)}</li>`).join("")}</ol>`;
      if (b.lista) return `<ul class="lista">${b.lista.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
      if (b.sub) return `<h3 class="sub">${esc(b.sub)}</h3>`;
      if (b.cita) return `<blockquote class="cita">“${esc(b.cita)}”${b.autor ? `<cite>${esc(b.autor)}</cite>` : ""}</blockquote>`;
      if (b.pergunta) return `<p class="pergunta">${esc(b.pergunta)}</p>`;
      return "";
    }).join("")}</div>`;
  }
  function cartaoCapsula(c, hoje) {
    return `<button class="capsula-hoje t-${c.tema}" data-capsula="${c.dia}">
      <span class="tema-tag">${hoje ? "Cápsula de hoje · " : ""}Dia ${c.dia} · ${TEMAS[c.tema]}</span>
      <h2>${esc(c.titulo)}</h2>
      <span class="suave">${est.vistas[c.dia] ? "Vista · tocar para rever" : `${c.minutos} min · ${c.cartas.length} cartas`}</span>
      <span class="abrir">${est.vistas[c.dia] ? "✓" : "▶"}</span></button>`;
  }

  // ---------- Telas ----------
  // Práticas do dia feitas hoje; as que se fazem ao amanhecer e no pôr do sol ganham um check para cada vez.
  const VEZES = [["manha", "Amanhecer"], ["tarde", "Pôr do sol"]];
  const feitoHoje = k => ((est.hist[hojeIso] || {}).tec || []).includes(k);
  const duasVezes = (m, p) => p.k !== "teste" && /pôr do sol/.test(m.hora || "");
  const vezFeita = (k, v) => !!(((est.hist[hojeIso] || {}).vezes || {})[k + ":" + v]);
  function telaHoje() {
    const a = ATOS[est.ato];
    const momentos = a.momentos.map(m => `
      <section class="momento">
        <div class="momento-cab"><h3>${m.quando === "Noite" ? "Abaton" : m.quando === "04:00" ? despertar() : m.quando}</h3><span class="hora">${m.quando === "Noite" ? "a prática da noite · " + m.hora : m.hora}</span></div>
        ${m.praticas.map(p => `
          <button class="pratica ${feitoHoje(p.k) ? "ok" : ""}" data-pratica="${p.k}">
            <span class="ico">${ICO[p.ico]}</span>
            <span><span class="nome">${p.nome}</span><br><span class="det">${p.det}</span></span>
            <span class="feito">✓</span>

  function desenharPonto(ctx, x, y, tipo, cor, escala) {
    escala = escala || 1;
    if (tipo === 0) { ctx.fillStyle = "rgba(238,229,212,.22)"; ctx.beginPath(); ctx.arc(x, y, 1.6 * escala, 0, 7); ctx.fill(); }
    else if (tipo === 1) { ctx.fillStyle = "rgba(238,229,212,.85)"; ctx.beginPath(); ctx.arc(x, y, 2.6 * escala, 0, 7); ctx.fill(); }
    else if (tipo === 2) {
      ctx.fillStyle = cor;
      [[0, 0], [-4, -3], [4, -2], [-2, 4], [3, 4]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(x + dx * escala, y + dy * escala, 1.4 * escala, 0, 7); ctx.fill(); });
    } else {
      const r = 7 * escala;
      ctx.save(); ctx.shadowColor = "#f5c75b"; ctx.shadowBlur = 12 * escala; ctx.fillStyle = "#f5c75b";
      ctx.beginPath();
      for (let i = 0; i < 8; i++) { const ang = i * Math.PI / 4 - Math.PI / 2, rr = i % 2 ? r * .32 : r; ctx.lineTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }

  // Noites de exemplo: 9 semanas de prática, ficando mais lúcidas com o tempo.
  function noitesExemplo() {
    let s = 7; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    const n = [];
    for (let i = 0; i < 56; i++) {
      const p = i / 56, r = rnd();
      n.push(r < .45 - p * .35 ? 0 : r < .85 - p * .3 ? 1 : r < .97 - p * .12 ? 2 : 3);
    }
    return n;
  }

  function telaCeu() {
    const ex = noitesExemplo();
    const minhas = est.diario.map(d => d.tipo);
    const todas = ex.concat(minhas);
    const cont = [0, 0, 0, 0]; todas.forEach(t => cont[t]++);
    return `<div class="tela">${topo()}
      <div><span class="rotulo">Duat · o mundo da noite</span><h1>O céu das suas noites</h1></div>
      <p class="suave">Duat era, para os egípcios, o céu por onde o sol viaja à noite até renascer. Aqui é o seu diagrama de vivências: cada manhã vira um ponto. Uma estrela é um sonho lúcido ou uma viagem astral. Com os meses, a sua constelação aparece.</p>

      ${painelMes()}
    </div>`;
  }

  function pintarCeu() {
    const c = document.getElementById("ceu"); if (!c) return;
    const ctx = c.getContext("2d"), W = c.width, H = c.height;
    const cor = est.nevoeiro || "#a9b2f0";
    const g = ctx.createRadialGradient(W * .7, H * .1, 10, W * .7, H * .1, W);
    g.addColorStop(0, "#1f2346"); g.addColorStop(1, "#0b0c18");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    let s = 3; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < 160; i++) { ctx.fillStyle = `rgba(238,229,212,${.05 + rnd() * .1})`; ctx.fillRect(rnd() * W, rnd() * H, 1.2, 1.2); }
    const todas = noitesExemplo().concat(est.diario.map(d => d.tipo));
    const cols = 7, linhas = Math.ceil(todas.length / cols);
    const mx = 70, my = 50, dx = (W - mx * 2) / (cols - 1), dy = (H - my * 2) / Math.max(1, linhas - 1);
    const pos = todas.map((t, i) => {
      const col = i % cols, lin = Math.floor(i / cols);
      return { x: mx + col * dx + (rnd() - .5) * dx * .6, y: my + lin * dy + (rnd() - .5) * dy * .5, t };
    });
    const estrelas = pos.filter(p => p.t === 3);
    ctx.strokeStyle = "rgba(245,199,91,.28)"; ctx.lineWidth = 1.2; ctx.beginPath();
    estrelas.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
    pos.forEach(p => desenharPonto(ctx, p.x, p.y, p.t, cor, 1.6));
    const nEx = 56;
    for (let i = nEx; i < pos.length; i++) { ctx.strokeStyle = cor; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(pos[i].x, pos[i].y, 16, 0, 7); ctx.stroke(); }
    document.querySelectorAll("canvas[data-ponto]").forEach(cv => {
      const x = cv.getContext("2d"); x.clearRect(0, 0, 28, 28); desenharPonto(x, 14, 14, +cv.dataset.ponto, cor, 1.1);
    });
  }

  // ---------- Diário: gravar e calendário ----------

  let modoDiario = "gravar", mesVisto = new Date(new Date().getFullYear(), new Date().getMonth(), 1), diaSel = hojeIso, busca = "", filtro = null;

  const semAcento = c => c.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const chave = t => [...t].map(c => semAcento(c).charAt(0) || c).join("");
  function realcar(texto, termo) {
    if (!termo) return esc(texto);
    const t = chave(termo), base = chave(texto);
    let saida = "", i = 0, j;
    while ((j = base.indexOf(t, i)) !== -1) {
      saida += esc(texto.slice(i, j)) + "<mark>" + esc(texto.slice(j, j + t.length)) + "</mark>";
      i = j + t.length;
    }
    return saida + esc(texto.slice(i));
  }
  const PARADAS = new Set("para pelo pela pelos pelas como mais muito muita sobre entre quando onde estava estavam tinha tinham minha minhas meus meu nossa nosso ainda depois antes porque cada outra outro outras outros isso esse essa este esta numa num uma umas uns com sem que não nao sim era eram foi fui vez vezes tudo toda todo todos todas mim ela ele elas eles logo perdi senti percebi".split(" "));
  function palavrasQueSeRepetem() {
    const conta = {};

      const vistas = new Set((d.texto || "").toLowerCase().match(/[\p{L}]{4,}/gu) || []);
      vistas.forEach(w => { if (!PARADAS.has(semAcento(w))) conta[w] = (conta[w] || 0) + 1; });

    return Object.entries(conta).filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).slice(0, 8);

  function telaCalendario() {
    const porDia = {};

    { tipo: "texto", cor: "#0a0b19", luz: true, rotulo: "O fundo da caverna", titulo: "No fundo, uma luz", texto: "Em algum momento, uma esfera de luz ocupa tudo. É o nevoeiro: o limiar entre este mundo e o outro. Cada pessoa tem o seu, e cada nevoeiro tem uma cor.", botao: "Entrar no santuário" },
    { tipo: "caminho", cor: "#0a0b19", rotulo: "O santuário", titulo: "Seu caminho para a lucidez", botao: "Começar a jornada" }
  ];
  function abrirTravessia() {
    const d = document.createElement("div"); d.className = "caverna"; d.id = "caverna"; app.appendChild(d);
    est.perfil = est.perfil || {};
    const pf = est.perfil;
    let i = 0;
    const passo = () => {
      const t = TRAVESSIA[i];
      d.style.background = `radial-gradient(120% 70% at 50% 0%, ${t.cor}, #07080f 90%)`;
      let meio = "";
      if (t.tipo === "nome") meio = `<input class="campo-trav" id="trav-nome" type="text" placeholder="Seu nome" value="${esc(pf.nome || "")}" autocomplete="given-name">`;
      if (t.tipo === "escolha" || t.tipo === "multi") {
        const marcado = o => t.tipo === "multi" ? (pf[t.campo] || []).includes(o) : pf[t.campo] === o;
        meio = `<div class="opcoes-trav">${t.opcoes.map(o => `<button class="op-trav" type="button" data-op="${esc(o)}" aria-pressed="${marcado(o)}">${esc(o)}</button>`).join("")}</div><p class="nota-c" id="ensina" ${t.ensina && pf[t.campo] ? "" : "hidden"}>${t.ensina || ""}</p>`;
      }
      if (t.tipo === "sono") meio = `<div class="sono"><label>Hora de dormir<input type="time" id="dorme" value="${pf.dorme || "23:00"}"></label><label>Acordar<input type="time" id="acorda" value="${pf.acorda || "07:00"}"></label></div><p class="nota-c" id="sono-conta"></p>`;
      if (t.tipo === "respirar") meio = `<button class="segurar" id="segurar" type="button">segure para inspirar</button><div class="marcas">${Array.from({ length: t.vezes }, () => "<i></i>").join("")}</div>`;
      if (t.tipo === "lembrete") meio = `<div class="notif" style="max-width:300px">${SINAL}<span><span class="linha1"><span>OSIRION</span><span>agora</span></span><span class="msg">Será que estou sonhando?</span><br><span class="suave">Olhe para as suas mãos e conte os dedos.</span></span></div>`;
      if (t.tipo === "caminho") {
        const desp = despertar();
        meio = `<ol class="caminho">
          <li><b>Hoje à noite</b><span>O Início: a prática do Abaton e a busca do seu nevoeiro.</span></li>
          <li><b>Amanhã cedo</b><span>Os primeiros cinco minutos e a pergunta: qual a cor do seu nevoeiro?</span></li>
          <li><b>Primeira semana</b><span>O Primeiro Ato: as raízes, a Respiração Dourada e os testes de realidade.</span></li>
          <li><b>Em duas a três semanas</b><span>Os primeiros lampejos de lucidez e o despertar das ${desp}.</span></li>
          <li><b>Depois</b><span>Os cinco atos do método Arhat, a viagem astral e os seus alvos.</span></li></ol>`;
      }
      const titulo = t.tipo === "caminho" && pf.nome ? `${esc(pf.nome)}, este é o seu caminho` : t.titulo;
      d.innerHTML = `<div class="tela">
        <div class="profundidade" aria-hidden="true">${TRAVESSIA.map((_, j) => `<i class="${j <= i ? "on" : ""}"></i>`).join("")}</div>
        <div class="passo-c">
          ${t.ilus ? `<img class="ilus" src="${ILUS(t.ilus)}" alt="">` : ""}
          ${t.luz ? '<div class="luz" aria-hidden="true"></div>' : ""}
          <span class="rotulo">${t.rotulo}</span>
          <h1>${titulo}</h1>
          ${t.texto ? `<p>${t.texto}</p>` : ""}${t.sub ? `<p class="nota-c">${t.sub}</p>` : ""}
          ${meio}
          ${t.nota ? `<p class="nota-c">${t.nota}</p>` : ""}
        </div>
        <div class="pe-trav">
          ${t.tipo === "lembrete" ? '<button class="btn largo" id="trav-sim">Ativar os lembretes</button><button class="btn fantasma largo" id="trav-prox">Mais tarde</button>'
            : `<button class="btn largo" id="trav-prox">${t.botao || "Seguir"}</button>`}
          ${i > 0 ? '<button class="fechar" id="trav-volta" type="button">← voltar um portal</button>' : ""}
        </div>
      </div>`;
      d.scrollTop = 0;
      const prox = d.querySelector("#trav-prox");
      const avanca = () => {
        if (i < TRAVESSIA.length - 1) { i++; passo(); return; }
        const h = new Date(); est.travessia = `${h.getFullYear()}-${h.getMonth() + 1}-${h.getDate()}`;
        if (pf.desejos && pf.desejos.includes("Conhecer o Egito antigo")) est.alvo = { r: 0, a: 0, c: 0, s: 0, t: [0, 1], q: 0 };
        salvar(); d.remove(); aba = "hoje"; render();
      };
      const volta = d.querySelector("#trav-volta"); if (volta) volta.onclick = () => { i--; passo(); };
      if (t.tipo === "nome") {
        const inp = d.querySelector("#trav-nome");
        prox.disabled = !inp.value.trim();
        inp.oninput = () => { prox.disabled = !inp.value.trim(); };
        prox.onclick = () => { pf.nome = inp.value.trim(); salvar(); avanca(); };
        return;
      }
      if (t.tipo === "escolha") {
        prox.hidden = !pf[t.campo]; prox.textContent = "Atravessar";
        d.querySelectorAll(".op-trav").forEach(b => b.onclick = () => {
          pf[t.campo] = b.dataset.op; salvar();
          d.querySelectorAll(".op-trav").forEach(o => o.setAttribute("aria-pressed", o === b));
          const en = d.querySelector("#ensina"); if (en && t.ensina) en.hidden = false;
          prox.hidden = false;

      if (t.tipo === "multi") {
        d.querySelectorAll(".op-trav").forEach(b => b.onclick = () => {
          const lista = pf[t.campo] = pf[t.campo] || [];
          const k = lista.indexOf(b.dataset.op);
          if (k >= 0) lista.splice(k, 1); else lista.push(b.dataset.op);
          b.setAttribute("aria-pressed", k < 0); salvar();
        });
      }
      if (t.tipo === "sono") {
        const conta = () => {
          pf.dorme = d.querySelector("#dorme").value || "23:00"; pf.acorda = d.querySelector("#acorda").value || "07:00"; salvar();
          const [h1, m1] = pf.dorme.split(":").map(Number), [h2, m2] = pf.acorda.split(":").map(Number);
          let min = (h2 * 60 + m2) - (h1 * 60 + m1); if (min <= 0) min += 1440;
          d.querySelector("#sono-conta").textContent = `${Math.floor(min / 60)} h ${min % 60 ? (min % 60) + " min " : ""}de sono. O seu despertar de madrugada fica por volta das ${despertar()}.`;
        };
        d.querySelectorAll("input[type=time]").forEach(x => x.oninput = conta); conta();
      }
      if (t.tipo === "lembrete") d.querySelector("#trav-sim").onclick = () => { pf.lembretes = true; salvar(); avanca(); };
      if (t.tipo === "respirar") {
        prox.disabled = true;
        const seg = d.querySelector("#segurar"), marcas = d.querySelectorAll(".marcas i");
        let feitas = 0, t0 = 0;
        const comeca = e => { e.preventDefault(); t0 = Date.now(); seg.classList.add("inspira"); seg.textContent = "inspire…"; };
        const solta = () => {
          if (!t0) return;
          const ok = Date.now() - t0 > 2500; t0 = 0; seg.classList.remove("inspira");
          if (ok && feitas < t.vezes) { marcas[feitas].classList.add("on"); feitas++; }
          seg.textContent = feitas >= t.vezes ? "solto" : (ok ? "expire… e de novo" : "segure um pouco mais");
          if (feitas >= t.vezes) prox.disabled = false;
        };
        seg.addEventListener("pointerdown", comeca); seg.addEventListener("pointerup", solta); seg.addEventListener("pointerleave", solta); seg.addEventListener("pointercancel", solta);
        seg.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !t0) comeca(e); });
        seg.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") solta(); });
      }
      prox.onclick = avanca;
    };
    passo();
  }
  // Despertar de madrugada: cerca de cinco horas depois de deitar.
  function despertar() {
    const pf = est.perfil || {}; const [h, m] = (pf.dorme || "23:00").split(":").map(Number);
    const t = (h * 60 + m + 300) % 1440;
    return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`;
  }

  // O que abre primeiro: a entrada, depois a travessia, e só na manhã seguinte a pergunta do nevoeiro.
  function seguir() {
    if (!est.entrou) return abrirEntrada();
    if (!est.travessia) return abrirTravessia();
    const h = new Date(), hoje = `${h.getFullYear()}-${h.getMonth() + 1}-${h.getDate()}`;
    if (!est.nevoeiro && est.travessia !== hoje && est.perguntou !== hoje) { est.perguntou = hoje; salvar(); abrirNevoeiro(); return; }
    // De manhã, na primeira vez que abre o app, ele vai direto para o diário escuro dos primeiros 5 minutos.
    const hr = h.getHours();
    if (hr >= 4 && hr < 11 && est.manha !== hojeIso && !est.diario.some(d => isoNoite(d) === hojeIso)) {
      est.manha = hojeIso; salvar(); manha = true; aba = "diario"; modoDiario = "gravar"; render();
    }
  }

  function acharPratica(k) {
    const a = ATOS[est.ato];
    for (const m of a.momentos) for (const p of m.praticas) if (p.k === k) return { a, m, p };
    return null;
  }

  function abrirPratica(k) {
    if (k === "teste") return abrirTeste();
    const achada = acharPratica(k); if (!achada) return;
    const { a, m, p } = achada;
    if (p.irDiario) { aba = "diario"; modoDiario = "gravar"; render(); return; }
    // Um bloco por tela; um subtítulo vai junto com o bloco seguinte.
    const passos = [];
    (p.texto || []).forEach(b => {
      const ult = passos[passos.length - 1];
      if (ult && ult.length === 1 && ult[0].sub) ult.push(b); else passos.push([b]);
    });
    const respHtml = p.resp ? `<div class="tela resp" style="padding:0;gap:12px">
        <div class="circulo-wrap"><div class="circulo" id="circ"></div></div>
        <div class="contagem" id="cont">0 / ${p.resp.n}</div>
        <p class="fase" id="fase">Leia os passos e depois respire junto.</p>
        <button class="btn" id="iniciar">Começar</button></div>` : "";
    const player = p.audio ? `<div class="player"><button class="play" id="play" aria-label="Ouvir a prática">▶</button>
        <div><b>Prática guiada pela Vivian</b><div class="suave">o áudio será gravado por você</div><div class="trilho"><span id="trilho"></span></div></div></div>` : "";
    const fim = k === "noite" ? "Vou dormir" : k === "madrugada" ? "Voltar a dormir" : k === "diario" ? "Abrir o diário" : "Feito";
    abrirSobre(`<div class="tela">${voltar}
      <span class="rotulo">${esc(a.nome)} · ${m.quando === "Noite" ? "Abaton, a prática da noite" : esc(m.quando)}</span><h1>${esc(p.nome)}</h1>
      ${respHtml}${player}
      <div class="passo-wrap" id="passo"></div>
      <div class="pontos" id="pontos"></div>
      <div class="story-pe"><button class="btn fantasma voltar-c" id="ant" aria-label="Passo anterior">‹</button><button class="btn largo" id="prox"></button></div></div>`, d => {
      let i = 0;
      const mostra = () => {
        const bl = passos[i] || [];
        const alvo = k === "noite" && est.alvo && i === passos.length - 1 ? `<div class="cartao"><span class="rotulo">Alvo desta noite</span><p>${esc(alvoTexto(est.alvo))}</p></div>` : "";
        d.querySelector("#passo").innerHTML = (i === 0 && p.ilus ? `<img class="ilus" src="${ILUS(p.ilus)}" alt="">` : "") + blocos(bl.map(b => b.p && b.p.length < 400 ? Object.assign({}, b, { grande: true }) : b)) + alvo;
        d.querySelector("#pontos").innerHTML = passos.map((_, j) => `<i class="${j <= i ? "on" : ""}"></i>`).join("");
        d.querySelector("#ant").disabled = i === 0;
        d.querySelector("#prox").textContent = i < passos.length - 1 ? "Próximo" : fim;
      };
      d.querySelector("#ant").onclick = () => { if (i > 0) { i--; mostra(); } };
      d.querySelector("#prox").onclick = () => {
        if (i < passos.length - 1) { i++; mostra(); return; }
        marcar(p.k); if (duasVezes(m, p)) marcarVez(p.k, new Date().getHours() < 15 ? "manha" : "tarde");
        fecharSobre();
        if (k === "diario") { aba = "diario"; modoDiario = "gravar"; }
        render();
        if (k === "noite" || k === "madrugada") abrirModoNoite();
      };
      mostra();
      const play = d.querySelector("#play");
      if (play) play.onclick = () => {
        const t = d.querySelector("#trilho"); let w = 0; play.textContent = "❚❚";
        const anda = () => { w += 4; t.style.width = Math.min(w, 100) + "%"; if (w < 100) timers.push(setTimeout(anda, 500)); else play.textContent = "▶"; };
        anda();
      };
      const ini = d.querySelector("#iniciar");
      if (ini) ini.onclick = () => {
        ini.hidden = true;
        const r = p.resp, circ = d.querySelector("#circ"), cont = d.querySelector("#cont"), fase = d.querySelector("#fase");
        const segura = r.segura ? 3000 : 0;
        let n = 0;
        const ciclo = () => {
          if (n >= r.n) { fase.textContent = r.fim; marcar(p.k); return; }
          n++; cont.textContent = n + " / " + r.n;
          circ.classList.add("grande"); fase.textContent = r.inspire;
          if (segura) timers.push(setTimeout(() => { fase.textContent = r.segurar; }, 4000));
          timers.push(setTimeout(() => { circ.classList.remove("grande"); fase.textContent = r.expire; }, 4000 + segura));
          timers.push(setTimeout(ciclo, 8000 + segura));
        };
        ciclo();
      };
    });
  }

  function abrirCapsula(dia) {
    const c = CAPS[dia - 1]; if (!c || dia > diaDaJornada()) return;
    const fundo = TEXTURA[c.tema];
    abrirSobre(`<div class="story t-${c.tema}" style="position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column">
      <div class="fundo" style="background-image:url('${fundo}')"></div>

          carta.querySelectorAll(".opcao").forEach(b => b.onclick = () => {

          });

          carta.innerHTML = `<span class="rotulo" style="color:var(--tema)">Faça · ${esc(k.titulo)}</span><p class="grande media">${esc(k.texto)}</p>${k.segundos ? `<button class="timer" id="tim">${k.segundos}s</button>` : ""}`;
          const tim = carta.querySelector("#tim");
          if (tim) tim.onclick = () => {
            let r = k.segundos; tim.disabled = true;
            const tic = () => { tim.textContent = r + "s"; if (r-- > 0) timers.push(setTimeout(tic, 1000)); else tim.textContent = "✓"; };
            tic();
          };
        } else if (k.t === "leva") carta.innerHTML = `${c.ilus ? `<img class="ilus pequena" src="${ILUS(c.ilus)}" alt="">` : ""}<span class="rotulo" style="color:var(--tema)">Para levar hoje</span><p class="grande">“${esc(k.texto)}”</p>${de}`;
        else if (k.t === "alvo") {
          carta.innerHTML = `<span class="rotulo" style="color:var(--tema)">Sorteie o alvo desta noite</span>${cartaoSorteio()}`;

      d.querySelector("#ant").onclick = () => { if (i > 0) { i--; desenha(); } };
      d.querySelector("#prox").onclick = () => {
        if (i < c.cartas.length - 1) { i++; desenha(); return; }
        if (!est.vistas[c.dia]) registrar("capsula");
        est.vistas[c.dia] = true; salvar(); fecharSobre(); render();
      };

    });
  }

  function abrirTeste() {
    const bolas = Array.from({ length: 10 }, (_, i) => `<i class="${i < testesHoje() ? "on" : ""}"></i>`).join("");
    abrirSobre(`<div class="tela">${voltar}
      <span class="rotulo">Teste de realidade</span><h1>Será que estou sonhando?</h1>
      <p class="suave">Pare. Sinta os pés firmes no chão. Faça uma inspiração consciente.</p>
      <div class="passos">
        <div class="passo"><h3>As mãos</h3><p class="suave">Conte os dedos. Puxe o indicador. Se esticar, ou se houver mais ou menos de dez dedos, você está sonhando.</p></div>
        <div class="passo"><h3>A respiração</h3><p class="suave">Tampe o nariz e tente respirar por ele. Se o ar passar, é sonho.</p></div>
        <div class="passo"><h3>Letras e números</h3><p class="suave">Olhe a palavra, desvie o olhar, olhe de novo. No sonho ela muda.</p>
          <div class="letras" id="letras">OSIRION</div><button class="btn fantasma" id="olhar">Olhar de novo</button></div>
      </div>
      <div><span class="rotulo">Hoje</span><div class="contador" style="margin-top:8px">${bolas}</div></div>
      <button class="btn largo" data-acao="acordado">Não estou sonhando, por enquanto</button></div>`, d => {
      d.querySelector("#olhar").onclick = () => {
        const l = d.querySelector("#letras"); l.style.opacity = .1;
        timers.push(setTimeout(() => { l.style.opacity = 1; l.textContent = "OSIRION"; }, 500));

  // ---------- Progresso: o que acontece em cada dia ----------
  // est.hist guarda, por dia, quantas vezes cada coisa aconteceu: testes, práticas (e quais), cápsulas, modo noite, sorteios.
  function registrar(k, tec) {
    const h = est.hist[hojeIso] = est.hist[hojeIso] || {};
    if (tec) { h.tec = h.tec || []; if (h.tec.includes(tec)) return; h.tec.push(tec); }
    h[k] = (h[k] || 0) + 1;
  }
  const testesHoje = () => (est.hist[hojeIso] || {}).testes || 0;
  const isoMais = (iso, n) => { const d = deIso(iso); d.setDate(d.getDate() + n); return isoDe(d); };
  const isoNoite = d => d.iso || hojeIso;
  function diaAtivo(iso) {
    const h = est.hist[iso];
    return !!(h && Object.keys(h).some(k => k !== "tec" && h[k] > 0)) || est.diario.some(d => isoNoite(d) === iso);
  }
  // A chama da disciplina: dias seguidos e a força dos últimos sete dias. Ela enfraquece, mas nunca se apaga.
  function chama() {
    let seq = 0, d = diaAtivo(hojeIso) ? hojeIso : isoMais(hojeIso, -1);
    while (seq < 999 && diaAtivo(d)) { seq++; d = isoMais(d, -1); }
    const semana = Array.from({ length: 7 }, (_, i) => diaAtivo(isoMais(hojeIso, i - 6)));
    const n = semana.filter(Boolean).length;
    const nome = n >= 6 ? "Chama forte" : n >= 4 ? "Chama acesa" : n >= 2 ? "Chama baixa" : "Brasa";
    return { seq, semana, n, forca: .3 + n / 7 * .7, nome, hoje: diaAtivo(hojeIso) };

  // ---------- Painel do mês (no Duat) ----------

  function painelMes() {

    const nomeMes = agora.toLocaleDateString("pt-BR", { month: "long" });
    return `<section class="painel"><div class="momento-cab"><h2>Painel de ${esc(nomeMes)}</h2><span class="hora">${corridos} noites até hoje</span></div>
      <div class="kpis">

  // ---------- Sons da noite (feitos no próprio aparelho) ----------
  function ruido(ctx, seg, marrom) {
    const n = ctx.sampleRate * seg, b = ctx.createBuffer(1, n, ctx.sampleRate), x = b.getChannelData(0); let ult = 0;
    for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; if (marrom) { ult = (ult + .02 * w) / 1.02; x[i] = ult * 3.5; } else x[i] = w; }
    return b;
  }
  function tocarSom(nome) {
    const ctx = audio(); if (!ctx) return null; if (ctx.state === "suspended") ctx.resume();
    const t = ctx.currentTime, out = ctx.createGain(), nos = [];
    out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(1, t + 3); out.connect(ctx.destination);
    const fonte = marrom => { const s = ctx.createBufferSource(); s.buffer = ruido(ctx, 5, marrom); s.loop = true; s.start(); nos.push(s); return s; };
    const ganho = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
    const filtro = (tipo, f) => { const q = ctx.createBiquadFilter(); q.type = tipo; q.frequency.value = f; return q; };
    const osc = (f, tipo) => { const o = ctx.createOscillator(); o.type = tipo || "sine"; o.frequency.value = f; o.start(); nos.push(o); return o; };
    if (nome === "chuva") {
      const hp = filtro("highpass", 500), lp = filtro("lowpass", 6000), g = ganho(.1); fonte(false).connect(hp); hp.connect(lp); lp.connect(g); g.connect(out);
      const g2 = ganho(.3); fonte(true).connect(g2); g2.connect(out);
    } else if (nome === "mar") {
      const lp = filtro("lowpass", 700), g = ganho(.35), onda = osc(.08), prof = ganho(.3), prof2 = ganho(450);
      onda.connect(prof); prof.connect(g.gain); onda.connect(prof2); prof2.connect(lp.frequency);
      fonte(true).connect(lp); lp.connect(g); g.connect(out);
    } else { // a noite na mata: grilos e cigarras sobre um fundo baixo
      const gb = ganho(.07); fonte(true).connect(gb); gb.connect(out);
      [[4300, 1.7, .025], [5100, 2.3, .018], [3700, .6, .012]].forEach(([f, ritmo, v]) => {
        const am = ganho(0), trem = osc(42, "square"), tg = ganho(.5), porta = ganho(.5), pulso = osc(ritmo, "square"), pg = ganho(.5), g = ganho(v);
        trem.connect(tg); tg.connect(am.gain); pulso.connect(pg); pg.connect(porta.gain);
        osc(f).connect(am); am.connect(porta); porta.connect(g); g.connect(out);
      });
    }
    return { parar() { const a = ctx.currentTime; out.gain.cancelScheduledValues(a); out.gain.setValueAtTime(out.gain.value, a); out.gain.linearRampToValueAtTime(0, a + 2); setTimeout(() => { nos.forEach(n => { try { n.stop(); } catch (e) {} }); out.disconnect(); }, 2300); } };
  }

    </div>`, d => {
      let som = null, nomeSom = null, minutos = 30, fimSom = 0, alarme = 0, tocando = 0, lock = null;

  // ---------- Diário: voz que vira texto ----------
  let rec = null;
  function gravarVoz(b) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition, tx = document.getElementById("gravar-tx"), area = document.getElementById("sonho");
    if (rec) { rec.stop(); return; }
    if (!SR) { tx.textContent = "Neste aparelho a voz não vira texto aqui dentro. Toque na caixa abaixo e use o microfone do teclado para ditar."; area.focus(); return; }
    rec = new SR(); rec.lang = "pt-BR"; rec.continuous = true; rec.interimResults = true;
    const base = area.value ? area.value.replace(/\s*$/, " ") : ""; let final = "";
    rec.onresult = e => {
      let prov = "";
      for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) final += r[0].transcript.trim() + " "; else prov += r[0].transcript; }
      area.value = base + final + prov;
    };
    rec.onerror = e => { tx.textContent = e.error === "not-allowed" || e.error === "service-not-allowed" ? "O Osirion precisa da permissão do microfone. Ou use o microfone do teclado." : "Não consegui ouvir. Tente de novo ou use o microfone do teclado."; };

    }
    else if (acao === "acordado") { registrar("testes"); if (testesHoje() >= 7) marcar("teste"); salvar(); fecharSobre(); render(); }
    else if (acao === "adiantar") { est.adianta = (est.adianta || 0) + 1; salvar(); render(); }
    else if (acao === "comprar") { est.pago = true; salvar(); render(); }
    else if (acao === "feito") { const k = b.dataset.k; marcar(k); fecharSobre(); if (k === "diario") { aba = "diario"; modoDiario = "gravar"; } render(); }
  });
  app.addEventListener("input", e => {
    if (e.target.id === "busca") {
      busca = e.target.value;
      document.getElementById("lista-cal").innerHTML = listaCalendario();
      document.querySelectorAll("[data-palavra]").forEach(c => c.setAttribute("aria-pressed", !!busca.trim() && chave(busca.trim()) === chave(c.dataset.palavra)));
      document.querySelectorAll(".cal .dia").forEach(d => d.setAttribute("aria-pressed", !busca && filtro === null && d.dataset.dia === diaSel));
      return;
    }
    if (e.target.id === "cor-livre") { est.nevoeiro = e.target.value; aplicarCor(); document.querySelectorAll(".cor").forEach(c => c.setAttribute("aria-pressed", "false")); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("sobre") && est.nevoeiro) { fecharSobre(); render(); } });

  render();
  seguir();
})();
</script>

</body>
</html>
